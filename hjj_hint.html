<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>简易代码编辑器 - Python / C / C++</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#1e1e1e;color:#e0e0e0;display:flex;flex-direction:column;height:100vh}
  .toolbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#252526;border-bottom:1px solid #3c3c3c;flex-wrap:wrap}
  .toolbar h1{font-size:15px;font-weight:600;color:#fff;margin-right:8px;white-space:nowrap}
  select,button{padding:7px 14px;border:1px solid #3c3c3c;border-radius:6px;background:#3c3c3c;color:#e0e0e0;font-size:13px;cursor:pointer;font-family:inherit;outline:none}
  select:hover,button:hover{background:#505050}
  button.run{background:#0e639c;color:#fff;border-color:#1177bb}
  button.run:hover{background:#1177bb}
  button.run:disabled{opacity:.5;cursor:not-allowed}
  .spacer{flex:1}
  .editor-wrap{flex:1;overflow:hidden;position:relative}
  .CodeMirror{height:100%!important;font-size:14px;font-family:ui-monospace,Consolas,monospace}
  .symbar{display:flex;flex-wrap:wrap;gap:5px 6px;padding:8px 12px;background:#252526;border-top:1px solid #3c3c3c;border-bottom:1px solid #3c3c3c;user-select:none}
  .symbar .sym-break{flex-basis:100%;width:100%;height:1px;padding:0;border:none;margin:0;background:none;min-width:100%;pointer-events:none}
  .symbar .sym{
    min-width:32px;padding:5px 8px;border:1px solid #3c3c3c;border-radius:5px;
    background:#2d2d2d;color:#d4d4d4;font-family:ui-monospace,Consolas,monospace;
    font-size:14px;font-weight:600;text-align:center;cursor:pointer;
    transition:background .1s,transform .08s;line-height:1;
  }
  .symbar .sym:hover{background:#3c3c3c}
  .symbar .sym:active{transform:scale(.92);background:#0e639c;color:#fff}
  .symbar .sym-wide{min-width:auto;padding:5px 10px}
  /* 引号和配对符号更显眼 */
  .symbar .sym-quote{color:#ffcc66;border-color:#5a4a2a;background:#3a2e1a;font-size:16px;font-weight:800}
  .symbar .sym-pair{color:#88c0ff;border-color:#2a4a6a;background:#1a2e3a}
  .output-panel{height:30%;min-height:140px;display:flex;flex-direction:column}
  .output-header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:#252526;font-size:12px;color:#888;border-top:1px solid #3c3c3c}
  .output-header button{padding:4px 10px;font-size:11px}
  .output-content{flex:1;overflow:auto;padding:12px 16px;font-family:ui-monospace,Consolas,monospace;font-size:13px;white-space:pre-wrap;word-break:break-all;line-height:1.6;background:#1e1e1e}
  .out-stdout{color:#d4d4d4}
  .out-stderr{color:#f48771}
  .out-meta{color:#6a9955;font-size:12px;margin-bottom:6px}
  .out-error{color:#f48771}
  .err-summary{background:#2a1a1a;border:1px solid #6b2020;border-radius:6px;padding:10px 14px;margin-bottom:10px;color:#f48771;font-size:13px;line-height:1.7}
  .err-summary .err-type{font-weight:700;font-size:14px;margin-bottom:4px;color:#f87171}
  .err-summary .err-pos{color:#fbbf24;font-size:12px}
  /* 自动补全弹窗适配深色主题 */
  .CodeMirror-hints{background:#252526;border:1px solid #3c3c3c;border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.5);font-family:ui-monospace,Consolas,monospace;font-size:13px;max-height:220px;overflow-y:auto;z-index:9999}
  .CodeMirror-hint{padding:4px 12px;color:#d4d4d4;cursor:pointer;border-radius:4px;margin:2px}
  .CodeMirror-hint:hover,.CodeMirror-hint-active{background:#094771;color:#fff}
  @media(max-width:600px){
    .toolbar{padding:8px 10px;gap:6px}
    .toolbar h1{font-size:13px;margin-right:4px}
    select,button{padding:6px 10px;font-size:12px}
    .symbar{gap:4px 5px;padding:6px 8px;flex-wrap:wrap}
    .symbar .sym{min-width:26px;padding:4px 6px;font-size:13px;flex-shrink:0}
    .symbar .sym-quote{font-size:15px}
    .output-panel{height:35%;min-height:120px}
    .output-content{font-size:12px;padding:10px}
  }
</style>
</head>

<div class="toolbar">
  <h1>⚡ 代码编辑器</h1>
  <select id="lang">
    <option value="python">Python</option>
    <option value="c">C</option>
    <option value="cpp">C++</option>
  </select>
  <div class="spacer"></div>

</div>
<div class="editor-wrap"><textarea id="code"></textarea></div>
<div class="symbar" id="symbar"></div>
<div class="output-panel">

    <span>输出</span>
    <button onclick="clearOutput()">清空</button>
  </div>
  <div class="output-content" id="output"><span class="out-meta">点击「运行」执行代码，输出将显示在此处。</span></div>
</div>

function pythonCustomHint(cm, options) {
  const cur = cm.getCursor();
  const line = cm.getLine(cur.line);
  const toCursor = line.slice(0, cur.ch);
  // 1) from 模块 import 子项提示
  const fromImportMatch = toCursor.match(/\bfrom\s+([a-zA-Z_][\w.]*)\s+import\s+([a-zA-Z_][\w]*)?$/);
  if (fromImportMatch) {
    const modName = fromImportMatch[1];
    const partial = fromImportMatch[2] || '';
    const subs = PY_SUBMODULES[modName] || PY_SUBMODULES[modName.toLowerCase()] || [];
    if (subs.length) {
      const filtered = subs.filter(s => s.toLowerCase().startsWith(partial.toLowerCase()));
      if (filtered.length) {
        return {
          list: filtered.map(s => ({text: s})),
          from: CodeMirror.Pos(cur.line, cur.ch - partial.length),
          to: cur
        };
      }
    }
  }
  // 2) import xxx 或 from xxx 时提供模块提示
  const importMatch = toCursor.match(/\b(?:import|from)\s+([a-zA-Z_][\w.]*)?$/);
  if (importMatch) {
    const partial = importMatch[1] || '';
    const filtered = PY_MODULES.filter(m => m.toLowerCase().startsWith(partial.toLowerCase()));
    return {
      list: filtered.map(m => ({text: m})),
      from: CodeMirror.Pos(cur.line, cur.ch - partial.length),
      to: cur
    };
  }
  // 3) 普通标识符补全：关键字 + 内置函数
  const wordMatch = toCursor.match(/([a-zA-Z_]\w*)$/);
  if (wordMatch) {
    const partial = wordMatch[1];
    const filtered = PY_BUILTINS.filter(k => k.toLowerCase().startsWith(partial.toLowerCase()));
    if (filtered.length) {
      return {
        list: filtered.map(k => ({text: k})),
        from: CodeMirror.Pos(cur.line, cur.ch - partial.length),
        to: cur
      };
    }
  }
  return null;
}

/* ===== 符号栏 ===== */
// 配对映射：左半 → 右半（点击左半时自动插入一对并把光标放中间）
const PAIR_MAP = {
  '(': ')', '[': ']', '{': '}', '"': '"', "'": "'"
};

const SYMBOLS = [
  // 第1行：括号和引号
  {ch:'(', cls:'sym-pair pair'},{ch:')', cls:''},
  {ch:'[', cls:'sym-pair pair'},{ch:']', cls:''},
  {ch:'{', cls:'sym-pair pair'},{ch:'}', cls:''},
  {ch:'"', cls:'sym-quote pair wide'},{ch:"'", cls:'sym-quote pair'},
  {ch:'\\n', cls:'sym-wide'},{ch:'\\t', cls:'sym-wide'},
  {ch:'BREAK'},
  // 第2行：标点符号
  {ch:';', cls:''},{ch:':', cls:''},{ch:',', cls:''},{ch:'.', cls:''},{ch:'?', cls:''},{ch:'!', cls:''},
  {ch:'#', cls:''},{ch:'@', cls:''},{ch:'$', cls:''},{ch:'_', cls:''},{ch:'\\', cls:''},
  {ch:'BREAK'},
  // 第3行：运算符和多行注释
  {ch:'+', cls:''},{ch:'-', cls:''},{ch:'*', cls:''},{ch:'/', cls:''},{ch:'%', cls:''},{ch:'=', cls:''},
  {ch:'<', cls:''},{ch:'>', cls:''},{ch:'&', cls:''},{ch:'|', cls:''},{ch:'^', cls:''},{ch:'~', cls:''},
  {ch:'//', cls:'sym-wide'},{ch:'/* */', cls:'sym-wide'},
  {ch:'"""', cls:'sym-wide sym-quote'},{ch:"'''", cls:'sym-wide sym-quote'}
];
function buildSymbar(){
  const bar = document.getElementById('symbar');
  SYMBOLS.forEach(s=>{
    if (s.ch === 'BREAK') { bar.appendChild(document.createElement('div')).className = 'sym-break'; return; }
    const ch = s.ch;
    const extra = {};
    if (ch.length === 1) {
      if (PAIR_MAP[ch]) extra.cls = (extra.cls||'') + ' pair';
    }
    const cls = (s.cls || '') + (extra.cls ? ' '+extra.cls : '');
    const el = document.createElement('span');
    el.className = 'sym ' + cls.trim();
    el.textContent = ch;
    el.title = '插入 ' + ch;
    el.dataset.ch = ch;
    el.addEventListener('click', e=>{
      e.preventDefault();
      editor.focus();
      insertSym(ch);
    });
    bar.appendChild(el);
  });
}

/* 符号栏点击插入 —— 配对符号自动插入一对并把光标放中间 */
function insertSym(ch) {
  const paired = PAIR_MAP[ch];   // 仅左半字符有配对
  if (paired) {
    // 插入一对，光标在中间
    const cur = editor.getCursor();
    const sel = editor.listSelections();
    const hasSel = sel && sel[0].head !== sel[0].anchor;
    if (hasSel) {
      // 选中了文字 —— 把选中内容包裹在配对符号中
      const from = sel[0].anchor, to = sel[0].head;
      const newFrom = { line: from.line, ch: from.ch + ch.length };
      editor.replaceSelection(ch + editor.getRange(from, to) + paired);
      editor.setSelection(newFrom, { line: newFrom.line, ch: newFrom.ch + (to.ch - from.ch) });
    } else {
      // 无选中 —— 直接插入一对，光标在中间
      editor.replaceSelection(ch + paired);
      editor.setCursor({ line: cur.line, ch: cur.ch + ch.length });
    }
    return;
  }
  // 三引号和多行符号的特殊处理
  if (ch === '"""') {
    const cur = editor.getCursor();
    editor.replaceRange('""""""', cur);
    editor.setCursor({line:cur.line, ch:cur.ch+3});
    return;
  }
  if (ch === "'''") {
    const cur = editor.getCursor();
    editor.replaceRange("''''''", cur);
    editor.setCursor({line:cur.line, ch:cur.ch+3});
    return;
  }
  if (ch === '/* */') {
    const cur = editor.getCursor();
    editor.replaceRange('/*  */', cur);
    editor.setCursor({line:cur.line, ch:cur.ch+3});
    return;
  }
  // 普通符号直接插入
  editor.replaceSelection(ch);
}

    (m,msg,line)=>({type:'缩进错误',msg:msg.trim(),line})],
  [/TabError:\s*([^,]+),?\s*(?:line\s*)?(\d+)/i,
    (m,msg,line)=>({type:'Tab/空格 混用',msg:msg.trim(),line})],
  [/NameError:\s*(.+)/i,
    (m,msg)=>({type:'名称未定义',msg:msg.trim()})],

  [/KeyError:\s*(.+)/i,
    (m,msg)=>({type:'字典键不存在',msg:msg.trim()})],

    (m,msg)=>({type:'除以零错误',msg:msg.trim()})],

    (m,msg)=>({type:'文件已存在',msg:msg.trim()})],
  [/PermissionError:\s*(.+)/i,
    (m,msg)=>({type:'权限被拒绝',msg:msg.trim()})],
  [/IsADirectoryError:\s*(.+)/i,
    (m,msg)=>({type:'是目录而非文件',msg:msg.trim()})],

    (m,msg)=>({type:'不是目录',msg:msg.trim()})],
  [/OSError:\s*(.+)/i,
    (m,msg)=>({type:'操作系统错误',msg:msg.trim()})],
  [/OverflowError:\s*(.+)/i,
    (m,msg)=>({type:'数值溢出',msg:msg.trim()})],
  [/RecursionError:\s*(.+)/i,
    (m,msg)=>({type:'递归过深',msg:msg.trim()})],
  [/RuntimeError:\s*(.+)/i,
    (m,msg)=>({type:'运行时错误',msg:msg.trim()})],
  [/StopIteration:\s*(.+)/i,
    (m,msg)=>({type:'迭代结束',msg:msg.trim()})],
  [/KeyboardInterrupt:\s*(.*)/i,
    (m,msg)=>({type:'用户中断',msg:msg.trim()||'程序被 Ctrl+C 中断'})],
  [/SystemExit:\s*(.*)/i,
    (m,msg)=>({type:'程序主动退出',msg:msg.trim()})],
  // ===== C / C++ 编译器错误 =====
  // 格式1: file.c(行): error C码: msg (MSVC)
  [/([a-zA-Z0-9_./-]+)\((\d+)(?::(\d+))?\):\s*(error|warning)\s*C(\d+):\s*(.+)/i,
    (m,file,line,col,kind,code,msg)=>({type:kind==='error'?'编译错误':'编译警告',msg:msg.trim(),line,col,code,file})],
  // 格式2: file.c:行:列: error: msg (GCC/Clang)
  [/([a-zA-Z0-9_./-]+):(\d+):(\d+):\s*(error|warning):\s*(.+)/i,
    (m,file,line,col,kind,msg)=>({type:kind==='error'?'编译错误':'编译警告',msg:msg.trim(),line,col,file})],
  // 格式3: file.c:行: (无列号)
  [/([a-zA-Z0-9_./-]+):(\d+):\s*(error|warning):\s*(.+)/i,
    (m,file,line,kind,msg)=>({type:kind==='error'?'编译错误':'编译警告',msg:msg.trim(),line,file})],

  [/undefined reference to\s+['"]?([^'"\s]+)['"]?/i,

];

function translateError(stderr) {
  if (!stderr) return null;
  const lines = stderr.split('\n').filter(Boolean);
  // 预提取 Python traceback 中的行号和文件名
  let tbLine = null, tbFile = null;
  const tbMatch = stderr.match(/File\s+"([^"]+)",\s*line\s+(\d+)/);
  if (tbMatch) { tbFile = tbMatch[1]; tbLine = tbMatch[2]; }
  // 先整体匹配
  for (const [regex, handler] of ERR_MAP) {
    const m = stderr.match(regex);
    if (m) {
      const info = handler(...m);
      // 如果错误本身没有行号，但 traceback 里有，则补上
      if (!info.line && tbLine) info.line = tbLine;
      if (!info.file && tbFile && tbFile !== '<stdin>' && tbFile !== '<string>') info.file = tbFile;
      return info;
    }
  }
  // 兜底：逐行匹配
  for (const line of lines) {
    for (const [regex, handler] of ERR_MAP) {
      const m = line.match(regex);
      if (m) {
        const info = handler(...m);
        if (!info.line && tbLine) info.line = tbLine;
        if (!info.file && tbFile && tbFile !== '<stdin>' && tbFile !== '<string>') info.file = tbFile;
        return info;
      }
    }
  }
  return null;
}

function renderErrorSummary(stderr) {
  const info = translateError(stderr);
  if (!info) return '';
  let html = '<div class="err-summary">';
  html += '<div class="err-type">❌ ' + escapeHtml(info.type) + '</div>';
  if (info.line) {
    html += '<div class="err-pos">📍 位置：第 ' + info.line + ' 行';
    if (info.col) html += '，第 ' + info.col + ' 列';
    if (info.file && info.file !== '<stdin>') html += '（文件：' + escapeHtml(info.file) + '）';
    html += '</div>';
  }
  if (info.code) html += '<div class="err-pos">错误码：' + escapeHtml(info.code) + '</div>';
  html += '<div style="margin-top:6px">' + escapeHtml(info.msg) + '</div>';
  html += '</div>';
  return html;
}

function setLang(lang, force) {
  const meta = LANG_META[lang];
  editor.setOption('mode', meta.mode);
  // 切换语言时如果已有自定义代码则确认
  if (!force && editor.getValue().trim() && editor.getValue().trim() !== SAMPLES[editor.currentLang].trim()) {
    if (!confirm('切换语言将丢失当前代码，确定继续？')) {
      document.getElementById('lang').value = editor.currentLang;
      return;
    }
  }
  editor.currentLang = lang;
  editor.setValue(SAMPLES[lang]);
}

function clearOutput(){ $('output').innerHTML = ''; }

async function runCode() {
  const btn = $('runBtn');
  btn.disabled = true;
  btn.textContent = '运行中...';
  clearOutput();
  appendOutput('<span class="out-meta">正在执行...</span>');
  const lang = $('lang').value;
  const meta = LANG_META[lang];
  const code = editor.getValue();
  const startTime = Date.now();
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 30000);
    const resp = await fetch('https://emkc.org/api/v1/piston/execute', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        language: meta.piston,
        source: code
      }),
      signal: ctrl.signal
    });
    clearTimeout(timer);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
    clearOutput();
    // 先展示 stdout（如果有）
    if (data.stdout) appendOutput('<span class="out-stdout">' + escapeHtml(data.stdout) + '</span>');
    // 再展示错误总结 + stderr 原文
    if (data.stderr) {
      const summary = renderErrorSummary(data.stderr);
      if (summary) appendOutput(summary);
      appendOutput('<details style="margin-top:6px"><summary style="color:#888;cursor:pointer;font-size:12px">查看完整错误原文</summary><span class="out-stderr" style="display:block;margin-top:6px">' + escapeHtml(data.stderr) + '</span></details>');
    }
    if (!data.stdout && !data.stderr) appendOutput('<span class="out-meta">（无输出）</span>');
    appendOutput('<span class="out-meta">⏱ 执行耗时 ' + elapsed + 's</span>');
  } catch (e) {
    clearOutput();
    if (e.name === 'AbortError') {
      appendOutput('<span class="out-error">⏱ 执行超时（超过30秒），请优化代码或重试</span>');
    } else if (e.message.includes('Failed to fetch') || e.message.includes('NetworkError')) {
      appendOutput('<span class="out-error">网络连接失败，请检查网络后重试</span>');
    } else {
      appendOutput('<span class="out-error">运行出错：' + escapeHtml(e.message) + '</span>');
    }
  } finally {
    btn.disabled = false;
    btn.textContent = '▶ 运行';
  }
}

editor.addKeyMap({
  'Ctrl-Enter': () => runCode(),
  'Cmd-Enter': () => runCode(),
  'Shift-Tab': 'indentLess',
  'Ctrl-Space': cm => cm.showHint({hint: pythonCustomHint, completeSingle: false}),
  'Alt-/': cm => cm.showHint({hint: pythonCustomHint, completeSingle: false})
});
</script>
